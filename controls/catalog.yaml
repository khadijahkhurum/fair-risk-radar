# Compliance-as-code control catalog — single source of truth.
# prisma/seed.ts reads this file and upserts the Control table from it.
# Change a mapping here, re-run `npm run db:seed`, and it propagates through
# the API, the framework selector, the dashboard, and the exported reports.
#
# euAiAct / owaspLlm are left "N/A" where a generic IT/security control has
# no genuine hook into an AI-specific framework — a forced mapping would be
# worse than an honest gap.

- id: mfa-enforcement
  name: Multi-Factor Authentication Enforcement
  description: All privileged and standard user accounts require MFA at login.
  category: Identity & Access Management
  mappings:
    nist_csf: PR.AA-03
    iso27001: A.8.5
    soc2: CC6.1
    pci_dss: 8.4.2
    eu_ai_act: "N/A"
    owasp_llm: "N/A"
  awsConfigRule: iam-user-mfa-enabled

- id: patch-management
  name: Endpoint Patch Management
  description: Managed instances are patched against known vulnerabilities within SLA.
  category: Vulnerability Management
  mappings:
    nist_csf: ID.RA-01
    iso27001: A.8.8
    soc2: CC7.1
    pci_dss: 6.3.3
    eu_ai_act: "N/A"
    owasp_llm: "LLM05: Supply Chain Vulnerabilities"
  awsConfigRule: ec2-managedinstance-patch-compliance-status

- id: key-rotation
  name: Encryption Key Rotation
  description: Customer-managed KMS keys are rotated on a scheduled basis.
  category: Cryptography
  mappings:
    nist_csf: PR.DS-01
    iso27001: A.8.24
    soc2: CC6.7
    pci_dss: 3.6.4
    eu_ai_act: "N/A"
    owasp_llm: "N/A"
  awsConfigRule: cmk-backing-key-rotation-enabled

- id: access-review
  name: Periodic Access Review
  description: User access rights are reviewed and recertified on a recurring cadence.
  category: Identity & Access Management
  mappings:
    nist_csf: PR.AA-05
    iso27001: A.5.18
    soc2: CC6.2
    pci_dss: "7.2.4"
    eu_ai_act: "Art. 14 (Human Oversight)"
    owasp_llm: "LLM08: Excessive Agency"
  awsConfigRule: null

- id: logging-monitoring
  name: Centralized Logging & Monitoring
  description: Security-relevant events are logged centrally and retained for investigation.
  category: Detection
  mappings:
    nist_csf: DE.CM-01
    iso27001: A.8.15
    soc2: CC7.2
    pci_dss: "10.2"
    eu_ai_act: "Art. 12 (Record-Keeping)"
    owasp_llm: "LLM06: Sensitive Information Disclosure"
  awsConfigRule: null

- id: vendor-risk-assessment
  name: Third-Party / Vendor Risk Assessment
  description: Vendors with access to sensitive data undergo a documented risk assessment before onboarding.
  category: Third-Party Risk
  mappings:
    nist_csf: GV.SC-06
    iso27001: A.5.19
    soc2: CC9.2
