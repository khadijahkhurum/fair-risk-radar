- id: data-encryption-at-rest
  name: Data Encryption at Rest
  description: Sensitive data stores are encrypted at rest using an approved cipher.
  category: Cryptography
  mappings:
    nist_csf: PR.DS-01
    iso27001: A.8.24
    soc2: CC6.7
