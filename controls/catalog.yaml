- id: incident-response-plan
  name: Incident Response Plan
  description: A documented, tested incident response plan exists and is exercised annually.
  category: Response & Recovery
  mappings:
    nist_csf: RS.MA-01
    iso27001: A.5.24
    soc2: CC7.4
    pci_dss: "12.10.1"
