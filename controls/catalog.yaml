# Compliance-as-code control catalog.
#
# This file is the single source of truth for the three controls the FAIR model
# tracks. `prisma/seed.ts` reads it and upserts each entry into the `Control`
# table, so the database is always a mirror of what's checked in here — change
# a mapping in a PR, re-run `npm run db:seed`, done. `weight` is the control's
# influence on the FAIR Vulnerability factor; weights across the file sum to 1.

- key: mfa
  name: MFA & Identity
  description: >
    Share of privileged and workforce identities behind phishing-resistant
    multi-factor authentication.
  weight: 0.35
  frameworkMappings:
    NIST CSF 2.0: "PR.AA-03, PR.AA-05"
    ISO 27001:2022: "A.5.17, A.8.5"
    SOC 2: "CC6.1, CC6.6"
    PCI DSS v4.0: "8.4.2, 8.5.1"

- key: patch
  name: Patch Cadence
  description: >
    Share of critical vulnerabilities remediated inside the organization's
    agreed remediation window.
  weight: 0.40
  frameworkMappings:
    NIST CSF 2.0: "ID.RA-01, PR.PS-02"
    ISO 27001:2022: "A.8.8, A.8.32"
    SOC 2: "CC7.1, CC8.1"
    PCI DSS v4.0: "6.3.3, 11.3.1"

- key: kms
  name: Cloud KMS
  description: >
    Share of regulated data stores encrypted under customer-managed keys
    with scheduled rotation.
  weight: 0.25
  frameworkMappings:
    NIST CSF 2.0: "PR.DS-01, PR.DS-02"
    ISO 27001:2022: "A.8.24, A.5.33"
    SOC 2: "CC6.7"
    PCI DSS v4.0: "3.5.1, 3.6.1"
